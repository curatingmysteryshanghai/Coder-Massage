<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Needlewhile · Ver. 0.2</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-phase="idle" data-entry="portal">
    <main
      class="toy"
      id="toy"
      tabindex="-1"
      role="application"
      aria-label="Needlewhile yarn-ball waiting game"
      aria-describedby="input-hint"
    >
      <section class="task-status" aria-live="polite" aria-label="Current task status">
        <p class="eyeline">CURRENT TASK</p>
        <h1 class="task-title" id="task-title">Waiting for an agent task</h1>
        <dl class="task-facts">
          <div>
            <dt>Phase</dt>
            <dd id="phase-label">Idle</dd>
          </div>
          <div>
            <dt>Elapsed</dt>
            <dd id="elapsed-label">00:00</dd>
          </div>
          <div>
            <dt>Steps</dt>
            <dd id="tool-label">00</dd>
          </div>
          <div>
            <dt>Pins</dt>
            <dd id="pin-count">000</dd>
          </div>
        </dl>
      </section>

      <p class="version-mark" aria-label="Version 0.2">NEEDLEWHILE / VER. 0.2</p>

      <div class="pin-layer pin-layer--back" id="pin-layer-back" aria-hidden="true"></div>

      <section class="ball-stage" aria-label="Yarn ball">
        <img
          class="wool-ball"
          id="wool-ball"
          src="/assets/wool-ball-teal.png?v=5"
          alt="A finely tangled teal and cream yarn ball"
          draggable="false"
        />
        <div class="fiber-detail" aria-hidden="true"></div>
      </section>

      <div class="pin-layer pin-layer--front" id="pin-layer" aria-hidden="true"></div>

      <section class="portal-gate" id="portal-gate" aria-labelledby="portal-title">
        <button class="portal-button" id="portal-button" type="button">
          <span class="portal-pixels" aria-hidden="true">
            <span class="portal-ring portal-ring--outer"></span>
            <span class="portal-ring portal-ring--middle"></span>
            <span class="portal-ring portal-ring--inner"></span>
            <span class="portal-core"></span>
            <span class="portal-spark portal-spark--one"></span>
            <span class="portal-spark portal-spark--two"></span>
            <span class="portal-spark portal-spark--three"></span>
            <span class="portal-spark portal-spark--four"></span>
          </span>
          <span class="portal-copy">
            <strong id="portal-title">Open time portal</strong>
            <span id="portal-subtitle">Click to enter Needlewhile</span>
          </span>
        </button>
      </section>

      <section class="completion" id="completion" aria-live="assertive" aria-hidden="true">
        <p class="completion-kicker">TANGLE COMPLETE</p>
        <h2>This round is complete</h2>
        <p id="completion-copy">Let the yarn and your thoughts rest for a moment.</p>
        <p class="countdown">Closing in <strong id="close-countdown">08</strong> seconds</p>
        <button class="close-now" id="close-now" type="button">Close now</button>
        <span class="ending-vortex" aria-hidden="true"></span>
      </section>

      <div class="utility-controls">
        <button class="icon-control sound-toggle" id="sound-toggle" type="button" aria-label="Turn sound off" aria-pressed="false">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5v5h3.4l4.1 3.3V6.2L7.4 9.5H4Z" />
            <path d="M15.1 8.6c1.7 1.7 1.7 5.1 0 6.8M17.7 6c3.2 3.3 3.2 8.7 0 12" />
          </svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5v5h3.4l4.1 3.3V6.2L7.4 9.5H4Z" />
            <path d="m15.5 9 5 5m0-5-5 5" />
          </svg>
          <span id="sound-label">Sound</span>
        </button>

        <button class="icon-control palette-toggle" id="palette-toggle" type="button" aria-label="Choose a random yarn and background palette">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10l-2.5-2.5M20 17H10l2.5 2.5M14 7l-2.5 2.5M10 17l2.5-2.5" />
          </svg>
          <span>Palette</span>
        </button>
      </div>

      <p class="input-hint" id="input-hint">Open the time portal to enter · ESC stays with the browser</p>
      <p class="sr-only" id="live-count" aria-live="polite"></p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
